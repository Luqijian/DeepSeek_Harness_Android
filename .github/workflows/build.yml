name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Build Linux runtime (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq curl xz-utils tar gzip python3
          bash runtime/build-runtime.sh

      - name: Verify 16 KB ELF alignment (proot binaries)
        run: |
          python3 - <<'PY'
          import glob, struct, sys
          bad = []
          for path in glob.glob('runtime/out/jniLibs/arm64-v8a/*.so'):
              data = open(path, 'rb').read()
              assert data[:4] == b'\x7fELF', path
              e_phoff = struct.unpack_from('<Q', data, 0x20)[0]
              e_phentsize = struct.unpack_from('<H', data, 0x36)[0]
              e_phnum = struct.unpack_from('<H', data, 0x38)[0]
              for i in range(e_phnum):
                  off = e_phoff + i * e_phentsize
                  p_type = struct.unpack_from('<I', data, off)[0]
                  p_align = struct.unpack_from('<Q', data, off + 48)[0]
                  if p_type == 1 and p_align < 0x4000:
                      bad.append((path, hex(p_align)))
          if bad:
              print('FAIL 16KB alignment:', bad); sys.exit(1)
          print('all proot binaries are 16 KB aligned')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: runtime
          retention-days: 3
          path: |
            runtime/out/rootfs.tar.gz
            runtime/out/manifest.json
            runtime/out/jniLibs/arm64-v8a/*.so

  apk:
    name: Build APK
    needs: runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@v4
        with:
          name: runtime
          path: runtime-out

      - name: Place runtime into the app
        run: |
          mkdir -p app/src/main/assets/runtime app/src/main/jniLibs/arm64-v8a
          cp runtime-out/rootfs.tar.gz app/src/main/assets/runtime/rootfs.bin
          cp runtime-out/manifest.json app/src/main/assets/runtime/manifest.json
          cp runtime-out/lib/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/ || \
            find runtime-out -name 'lib*.so' -exec cp {} app/src/main/jniLibs/arm64-v8a/ \;
          ls -lh app/src/main/assets/runtime app/src/main/jniLibs/arm64-v8a

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            cat > local.properties <<PROPS
          release.storeFile=$RUNNER_TEMP/release.keystore
          release.storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          release.keyAlias=${{ secrets.KEY_ALIAS }}
          release.keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS
          fi

      - name: Assemble release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/harness-android-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/harness-android.apk
            ( cd dist && sha256sum *.apk > SHA256SUMS )
            VERSION_CODE="${{ github.run_number }}"
            APK_SHA=$(sha256sum dist/harness-android.apk | cut -d' ' -f1)
            printf '{\n  "versionName": "%s",\n  "versionCode": %s,\n  "apk": "harness-android.apk",\n  "apkSha256": "%s"\n}\n' \
              "$(grep -oP '^appVersionName=\K.*' gradle.properties)" "$VERSION_CODE" "$APK_SHA" \
              > dist/update.json
          fi
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME" || \
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
