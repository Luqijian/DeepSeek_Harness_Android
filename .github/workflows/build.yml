name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Build Linux runtime (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq curl xz-utils tar gzip python3 proot
          bash runtime/build-runtime.sh

      - name: Verify 16 KB ELF alignment (proot binaries)
        run: |
          python3 - <<'PY'
          import glob, struct, sys
          bad = []
          for path in glob.glob('runtime/out/jniLibs/*/*.so'):
              data = open(path, 'rb').read()
              assert data[:4] == b'\x7fELF', path
              e_phoff = struct.unpack_from('<Q', data, 0x20)[0]
              e_phentsize = struct.unpack_from('<H', data, 0x36)[0]
              e_phnum = struct.unpack_from('<H', data, 0x38)[0]
              for i in range(e_phnum):
                  off = e_phoff + i * e_phentsize
                  p_type = struct.unpack_from('<I', data, off)[0]
                  p_align = struct.unpack_from('<Q', data, off + 48)[0]
                  if p_type == 1 and p_align < 0x4000:
                      bad.append((path, hex(p_align)))
          if bad:
              print('FAIL 16KB alignment:', bad); sys.exit(1)
          print('all proot binaries are 16 KB aligned')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: runtime
          retention-days: 3
          if-no-files-found: error
          path: |
            runtime/out/rootfs.tar.gz
            runtime/out/manifest.json
            runtime/out/jniLibs

  apk:
    name: Build APK
    needs: runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: runtime
          path: runtime-out

      - name: Place runtime into the app
        run: |
          ROOTFS=$(find runtime-out -name rootfs.tar.gz | head -1)
          MANIFEST=$(find runtime-out -name manifest.json | head -1)
          test -n "$ROOTFS" && test -n "$MANIFEST"
          mkdir -p app/src/main/assets/runtime app/src/main/jniLibs/arm64-v8a
          cp "$ROOTFS" app/src/main/assets/runtime/rootfs.bin
          cp "$MANIFEST" app/src/main/assets/runtime/manifest.json
          find runtime-out -name 'lib*.so' -exec cp {} app/src/main/jniLibs/arm64-v8a/ \;
          ls -lh app/src/main/assets/runtime app/src/main/jniLibs/arm64-v8a

      - name: Assemble debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Decode release keystore
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "release.storeFile=$RUNNER_TEMP/release.keystore"
              echo "release.storePassword=$KEYSTORE_PASSWORD"
              echo "release.keyAlias=$KEY_ALIAS"
              echo "release.keyPassword=$KEY_PASSWORD"
            } > local.properties
          fi

      - name: Assemble release APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/harness-android-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/harness-android.apk
            sha256sum dist/harness-android.apk > dist/SHA256SUMS
            cp "$(find runtime-out -name manifest.json | head -1)" dist/runtime-manifest.json
            APP_VERSION=$(grep -oP '^appVersionName=\K.*' gradle.properties)
            DSH_VERSION=$(grep -oP '^dshVersion=\K.*' gradle.properties)
            APK_SHA=$(sha256sum dist/harness-android.apk | cut -d' ' -f1)
            printf '{\n  "versionName": "%s+dsh%s",\n  "versionCode": %s,\n  "dshVersion": "%s",\n  "apk": "harness-android.apk",\n  "apkSha256": "%s"\n}\n' \
              "$APP_VERSION" "$DSH_VERSION" "${{ github.run_number }}" "$DSH_VERSION" "$APK_SHA" \
              > dist/update.json
          fi
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          retention-days: 3
          if-no-files-found: error
          path: dist/

  release:
    name: Publish GitHub Release
    needs: apk
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION=$(grep -oP '^appVersionName=\K.*' gradle.properties)
          DSH_VERSION=$(grep -oP '^dshVersion=\K.*' gradle.properties)
          TAG="v${APP_VERSION}-dsh${DSH_VERSION}-${{ github.run_number }}"
          test -f dist/harness-android.apk
          test -f dist/update.json
          mkdir -p release-assets
          cp dist/harness-android.apk dist/update.json dist/SHA256SUMS dist/runtime-manifest.json release-assets/
          NOTES="Harness Android ${APP_VERSION}, bundled @deepseek-ai/dsh ${DSH_VERSION}.

          Install harness-android.apk. Existing installations can use Settings → Check for updates for this release."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "$TAG" \
              --notes "$NOTES" \
              --latest \
              --target "$GITHUB_SHA"
          fi
          gh release view "$TAG" --json url,assets
